services:
  browser:
    build: .
    restart: "no"
    init: true
    shm_size: 1gb
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:9223:9223"
    environment:
      START_URL: "${START_URL:-about:blank}"
      SCREEN: "${SCREEN:-1920x1080x24}"
    volumes:
      - "${BROWSER_DATA_DIR:?Set BROWSER_DATA_DIR to a private directory outside Git}:/data"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9223/json/version >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
